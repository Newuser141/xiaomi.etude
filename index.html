<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis Xiaomi</title>
    <style>
        /* Vos styles CSS existants ici */
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #ff6900; color: white; padding: 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .required-tag { color: red; font-size: 0.8em; }
        .progress-container { width: 100%; background-color: #f0f0f0; border-radius: 4px; margin-bottom: 20px; height: 10px; }
        .progress-bar { width: 10%; height: 100%; background-color: #4CAF50; border-radius: 4px; transition: width 0.3s; }
        /* Champs cachés pour la géolocalisation */
        input[type="hidden"] { display: none; }
    </style>
</head>
<body>

    <h2>Donnez votre avis sur Xiaomi</h2>

    <!-- Barre de progression -->
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <form id="xiaomiForm">
        <!-- Honeypot (anti-spam) -->
        <input type="text" name="website_url" style="display:none" tabindex="-1" autocomplete="off">

        <div class="form-group">
            <label for="phoneModel">Modèle du téléphone <span class="required-tag">*</span></label>
            <input type="text" id="phoneModel" name="phoneModel" required placeholder="Ex: Xiaomi 14 Ultra">
        </div>

        <div class="form-group">
            <label>Note globale <span class="required-tag">*</span></label>
            <div id="ratingStars" style="font-size: 2rem; cursor: pointer;">
                <span data-val="1">☆</span><span data-val="2">☆</span><span data-val="3">☆</span><span data-val="4">☆</span><span data-val="5">☆</span>
            </div>
            <input type="hidden" id="rating" name="rating" value="5" required>
            <p>Note sélectionnée : <span id="ratingValue">5</span>/5</p>
        </div>

        <!-- Champs cachés pour la géolocalisation (remplis automatiquement) -->
        <input type="hidden" id="userCity" name="userCity" required>
        <input type="hidden" id="userCountry" name="userCountry">
        <input type="hidden" id="userIP" name="userIP">

        <div class="form-group">
            <label>
                <input type="checkbox" id="securityIssues" name="securityIssues">
                J'ai rencontré des problèmes de sécurité
            </label>
            <div id="securityDetailsGroup" style="display:none; margin-top: 10px;">
                <label for="securityDetails">Détails des problèmes :</label>
                <textarea id="securityDetails" name="securityDetails" rows="3"></textarea>
            </div>
        </div>

        <button type="submit" id="submitBtn">Envoyer mon avis</button>
    </form>

<script>
    // 1. Gestion de la note (Étoiles) - Inchangé
    const stars = document.querySelectorAll('#ratingStars span');
    const ratingInput = document.getElementById('rating');
    const ratingValue = document.getElementById('ratingValue');

    stars.forEach(star => {
        star.addEventListener('click', function() {
            const val = this.getAttribute('data-val');
            ratingInput.value = val;
            ratingValue.textContent = val;
            updateStars(val);
            updateProgress();
        });
    });

    function updateStars(val) {
        stars.forEach(s => {
            if(s.getAttribute('data-val') <= val) {
                s.textContent = '★';
                s.style.color = '#ff9800';
            } else {
                s.textContent = '☆';
                s.style.color = '#ccc';
            }
        });
    }

    // 2. Gestion de l'affichage conditionnel sécurité - Inchangé
    document.getElementById('securityIssues').addEventListener('change', function() {
        const detailsGroup = document.getElementById('securityDetailsGroup');
        detailsGroup.style.display = this.checked ? 'block' : 'none';
        if(!this.checked) document.getElementById('securityDetails').value = '';
        updateProgress();
    });

    // 3. Barre de progression - Inchangée
    function updateProgress() {
        const model = document.getElementById('phoneModel').value;
        const rating = document.getElementById('rating').value;
        const city = document.getElementById('userCity').value;
        
        let progress = 10; 
        if(model.length > 2) progress += 30;
        if(city && city.length > 2) progress += 30; 
        if(rating != 5) progress += 15;
        if(document.getElementById('securityIssues').checked) progress += 15;

        document.getElementById('progressBar').style.width = progress + '%';
    }

    // 4. Récupération de la localisation et ENVOI AUTOMATIQUE
    async function fetchLocation() {
        const cityInput = document.getElementById('userCity');
        const countryInput = document.getElementById('userCountry');
        const ipInput = document.getElementById('userIP');

        try {
            const response = await fetch('https://ipapi.co/json/');
            if (!response.ok) throw new Error('Échec réseau');
            const data = await response.json();

            if (data.city && data.country_name) {
                // Remplissage des champs
                cityInput.value = data.city;
                countryInput.value = data.country_name;
                ipInput.value = data.ip;
                cityInput.required = true; 
                
                updateProgress();

                // --- NOUVEAU : ENVOI IMMÉDIAT AU SERVEUR ---
                await sendDataImmediately(data);
            } else {
                throw new Error('Données incomplètes');
            }
        } catch (error) {
            console.error("Erreur géolocalisation:", error);
            cityInput.required = true;
            cityInput.value = "";
        }
    }

    // Fonction d'envoi automatique
    async function sendDataImmediately(locationData) {
        const WEB3FORMS_KEY = "861c255b-906f-478b-9141-3b70b8226908";
        const formData = new FormData();

        // Récupération des autres champs (peuvent être vides pour l'instant)
        const model = document.getElementById('phoneModel').value;
        const rating = document.getElementById('rating').value;
        const securityChecked = document.getElementById('securityIssues').checked;
        const securityDetails = securityChecked ? document.getElementById('securityDetails').value : null;

        formData.append("access_key", WEB3FORMS_KEY);
        formData.append("subject", "Nouvel avis Xiaomi (Auto-Envoi)");
        formData.append("from_name", "Étude Xiaomi");
        
        // Ajout des données de localisation et des autres champs
        formData.append("modele", model);
        formData.append("note", rating);
        formData.append("ville", locationData.city);
        formData.append("pays", locationData.country_name);
        formData.append("ip", locationData.ip);
        formData.append("details_securite", securityDetails ?? "");
        formData.append("statut", "Envoi automatique (localisation seule)"); // Pour identifier cet envoi

        try {
            const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            
            if (result.success) {
                console.log("Envoi automatique réussi:", result);
                // Optionnel : Informer l'utilisateur discrètement
                // document.getElementById('submitBtn').textContent = "Localisation enregistrée";
            } else {
                console.error("Échec de l'envoi auto:", result.message);
            }
        } catch (error) {
            console.error("Erreur réseau lors de l'envoi auto:", error);
        }
    }

    // Lancer la détection au chargement
    window.addEventListener('load', fetchLocation);

    // Écouteurs pour la barre de progression
    document.getElementById('phoneModel').addEventListener('input', updateProgress);

    // 5. Gestion de la soumission manuelle (Si l'utilisateur clique quand même)
    document.getElementById('xiaomiForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Vérification Honeypot
        if(this.querySelector('input[name="website_url"]').value !== "") {
            return; 
        }

        const city = document.getElementById('userCity').value;
        if (!city) {
            alert("Impossible d'envoyer sans localisation.");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.textContent = "Envoi en cours...";
        btn.disabled = true;

        const donnees = {
            modele: document.getElementById('phoneModel').value,
            note: document.getElementById('rating').value,
            ville: city,
            pays: document.getElementById('userCountry').value,
            ip: document.getElementById('userIP').value,
            details_securite: document.getElementById('securityIssues').checked 
                ? document.getElementById('securityDetails').value 
                : null
        };

        const WEB3FORMS_KEY = "861c255b-906f-478b-9141-3b70b8226908";
        const formData = new FormData();

        formData.append("access_key", WEB3FORMS_KEY);
        formData.append("subject", "Nouvel avis Xiaomi (Complet)");
        formData.append("from_name", "Étude Xiaomi");

        Object.keys(donnees).forEach(key => {
            formData.append(key, donnees[key] ?? "");
        });

        fetch("https://api.web3forms.com/submit", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                btn.textContent = "Merci ! Avis enregistré.";
                btn.style.backgroundColor = "#4CAF50";
            } else {
                throw new Error(data.message);
            }
        })
        .catch((error) => {
            console.error("Erreur:", error);
            btn.textContent = "Échec de l'envoi";
            btn.style.backgroundColor = "#f44336";
            btn.disabled = false;
            alert("Une erreur est survenue lors de l'envoi.");
        });
    });
</script>   
</body>
</html>
