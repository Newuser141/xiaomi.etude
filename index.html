<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis Utilisateur Xiaomi - Enquête Officielle</title>
    <style>
        :root {
            --mi-orange: #ff6900;
            --mi-gray: #f5f5f5;
            --text-dark: #333;
            --text-light: #666;
            --error-red: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--mi-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: var(--mi-orange);
            width: 0%;
            transition: width 0.3s ease;
        }

        h1 {
            color: var(--text-dark);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--mi-orange);
        }

        /* Style pour le champ localisation (visuel seulement, les données sont cachées) */
        .location-display {
            background-color: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .location-status {
            font-size: 0.8rem;
            font-weight: normal;
        }

        .rating-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--mi-orange);
            cursor: pointer;
        }

        .rating-value {
            font-weight: bold;
            color: var(--mi-orange);
            font-size: 1.2rem;
            min-width: 30px;
            text-align: right;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--mi-orange);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .security-question {
            display: flex;
            align-items: center;
            background: #fff8f0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ffe0b2;
        }

        button {
            width: 100%;
            background-color: var(--mi-orange);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #e65c00;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .trust-badge {
            text-align: center;
            font-size: 0.75rem;
            color: #999;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .hidden-field {
            display: none;
        }

        .error-msg {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
            font-weight: 600;
        }
        
        .required-tag {
            color: var(--error-red);
            font-size: 0.8rem;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-bar" id="progressBar"></div>
    
    <h1>Communauté Xiaomi</h1>
    <p class="subtitle">Aidez-nous à améliorer l'expérience MIUI en 2 minutes.</p>

    <form id="xiaomiForm" action="#" method="POST">
        
        <!-- Modèle du téléphone -->
        <div class="form-group">
            <label for="phoneModel">Quel modèle possédez-vous ?</label>
            <input type="text" id="phoneModel" name="phoneModel" list="xiaomiModels" placeholder="Ex: Redmi Note 13, Xiaomi 14..." required>
            <datalist id="xiaomiModels">
                <option value="Xiaomi 14 Ultra">
                <option value="Xiaomi 14">
                <option value="Xiaomi 13T Pro">
                <option value="Redmi Note 13 Pro">
                <option value="Redmi Note 12">
                <option value="POCO X6 Pro">
                <option value="POCO F5">
                <option value="Redmi 13C">
            </datalist>
        </div>

        <!-- Note sur 10 -->
        <div class="form-group">
            <label for="rating">Note globale (sur 10)</label>
            <div class="rating-container">
                <input type="range" id="rating" name="rating" min="1" max="10" value="5" oninput="updateRating(this.value)">
                <span class="rating-value" id="ratingValue">5</span>
            </div>
        </div>

        <!-- Localisation Automatique (Obligatoire) -->
        <div class="form-group">

            <!-- Champs cachés pour l'envoi des données -->
            <input type="hidden" id="userCity" name="userCity" required>
            <input type="hidden" id="userCountry" name="userCountry" required>
            <input type="hidden" id="userIP" name="userIP" required>
        </div>

        <!-- Question Sécurité -->
        <div class="form-group">
            <label>Avez-vous rencontré des problèmes de sécurité ?</label>
            <div class="security-question">
                <label class="toggle-switch">
                    <input type="checkbox" name="securityIssues" id="securityIssues">
                    <span class="slider"></span>
                </label>
                <span style="font-size: 0.9rem;">Oui, j'ai eu des alertes ou comportements suspects</span>
            </div>
        </div>

        <div class="form-group" id="securityDetailsGroup" style="display:none;">
            <label for="securityDetails" style="font-size: 0.85rem; color: #666;">Précisez brièvement (optionnel)</label>
            <textarea id="securityDetails" name="securityDetails" rows="2" placeholder="Ex: Publicités intrusives, application inconnue..."></textarea>
        </div>

        <!-- Email optionnel -->
        <div class="form-group">
            <label for="email" style="font-weight: normal; font-size: 0.85rem;">Votre email (pour recevoir les résultats de l'étude)</label>
            <input type="email" id="email" name="email" placeholder="nom@exemple.com">
        </div>

        <!-- Honeypot (Anti-spam) -->
        <input type="text" name="website_url" class="hidden-field" tabindex="-1" autocomplete="off">

        <button type="submit" id="submitBtn">Envoyer mon avis</button>

        <div class="trust-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Vos données (IP anonymisée incluse) sont sécurisées.
        </div>
    </form>
</div>

<script>
    // 1. Gestion de la note
    function updateRating(val) {
        document.getElementById('ratingValue').textContent = val;
        updateProgress();
    }

    // 2. Gestion de l'affichage conditionnel sécurité
    document.getElementById('securityIssues').addEventListener('change', function() {
        const detailsGroup = document.getElementById('securityDetailsGroup');
        if(this.checked) {
            detailsGroup.style.display = 'block';
        } else {
            detailsGroup.style.display = 'none';
            document.getElementById('securityDetails').value = '';
        }
        updateProgress();
    });

    // 3. Barre de progression
    function updateProgress() {
        const model = document.getElementById('phoneModel').value;
        const rating = document.getElementById('rating').value;
        const city = document.getElementById('userCity').value;
        
        let progress = 10; // Base
        if(model.length > 2) progress += 30;
        if(city.length > 2) progress += 30; // Localisation validée
        if(rating != 5) progress += 15;
        if(document.getElementById('securityIssues').checked) progress += 15;

        document.getElementById('progressBar').style.width = progress + '%';
    }

    // 4. Récupération automatique de la localisation via IP (API Gratuite: ipapi.co)
    async function fetchLocation() {
        const statusEl = document.getElementById('locationStatus');
        const textEl = document.getElementById('locationText');
        const errorEl = document.getElementById('locationError');
        const cityInput = document.getElementById('userCity');
        const countryInput = document.getElementById('userCountry');
        const ipInput = document.getElementById('userIP');

        try {
            // Appel à l'API ipapi.co (Gratuit, pas de clé requise pour usage basique, HTTPS supporté)
            const response = await fetch('https://ipapi.co/json/');
            
            if (!response.ok) throw new Error('Échec réseau');
            
            const data = await response.json();

            if (data.city && data.country_name) {
                // Succès
                cityInput.value = data.city;
                countryInput.value = data.country_name;
                ipInput.value = data.ip;

                textEl.textContent = `${data.city}, ${data.country_name}`;
                statusEl.textContent = '✅ Détecté';
                statusEl.style.color = 'green';
                errorEl.style.display = 'none';
                
                // Débloquer visuellement (le required HTML fera le vrai travail)
                cityInput.required = true; 
            } else {
                throw new Error('Données incomplètes');
            }

        } catch (error) {
            console.error("Erreur géolocalisation:", error);
            textEl.textContent = "Échec de la détection";
            statusEl.textContent = '❌';
            statusEl.style.color = 'red';
            errorEl.style.display = 'block';
            
            // On garde le required=true pour bloquer l'envoi si échec
            cityInput.required = true;
        }
        
        updateProgress();
    }

    // Lancer la détection au chargement
    window.addEventListener('load', fetchLocation);

    // Écouteurs pour la barre de progression
    document.getElementById('phoneModel').addEventListener('input', updateProgress);
    document.getElementById('rating').addEventListener('input', updateProgress);

        // 5. Gestion de la soumission
    document.getElementById('xiaomiForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Vérification Honeypot
        if(this.querySelector('input[name="website_url"]').value !== "") {
            return; 
        }

        // Vérification explicite de la localisation
        const city = document.getElementById('userCity').value;
        const errorEl = document.getElementById('locationError');
        
        if (!city) {
            errorEl.style.display = 'block';
            errorEl.textContent = "Impossible d'envoyer sans localisation. Veuillez réactualiser la page.";
            window.scrollTo(0, document.body.scrollHeight);
            return;
        }

        const btn = document.getElementById('submitBtn');
        const originalText = btn.textContent;
        
        // État de chargement
        btn.textContent = "Envoi en cours...";
        btn.disabled = true;

        // --- DÉBUT DE L'ENVOI RÉEL ---
        
        // 1. Préparation des données
        const donnees = {
            modele: document.getElementById('phoneModel').value,
            note: document.getElementById('rating').value,
            ville: city,
            pays: document.getElementById('userCountry').value,
            ip: document.getElementById('userIP').value,
            // Ajoutez ici d'autres champs si nécessaire (ex: securityDetails)
            details_securite: document.getElementById('securityIssues').checked 
                ? document.getElementById('securityDetails').value 
                : null
        };

        // 2. Envoi avec fetch
        // REMPLACEZ l'URL ci-dessous par celle de votre script serveur (ex: 'traitement.php')
        fetch('https://xiaomi-etude.xiaomi-etude.workers.dev/', { 
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(donnees)
})
        .then(response => {
            if (!response.ok) {
                throw new Error('Erreur serveur: ' + response.status);
            }
            return response.json(); // Ou response.text() si votre serveur ne renvoie pas de JSON
        })
        .then(data => {
            // SUCCÈS : Le serveur a bien reçu les données
            console.log('Succès:', data);
            btn.textContent = "Merci ! Avis enregistré.";
            btn.style.backgroundColor = "#4CAF50";
            
            // Optionnel : Réinitialiser le formulaire après 2 secondes
            // setTimeout(() => document.getElementById('xiaomiForm').reset(), 2000);
        })
        .catch((error) => {
            // ERREUR : Problème réseau ou serveur
            console.error('Erreur:', error);
            btn.textContent = "Échec de l'envoi";
            btn.style.backgroundColor = "#f44336";
            btn.disabled = false; // Réactiver le bouton pour réessayer
            
            alert("Une erreur est survenue lors de l'envoi. Veuillez réessayer.");
        });

        // --- FIN DE L'ENVOI RÉEL ---
        
        // Note : Le setTimeout a été supprimé car fetch est asynchrone et gère lui-même le délai réseau.
        // L'interface utilisateur est mise à jour dans les blocs .then() ou .catch() ci-dessus.
    });   
</script>

</body>
</html>
